<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Calendar — Instagram Pipeline</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { overflow: auto; background: #F7F6F2; }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    .cal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .cal-header-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cal-header-left h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1C1C1E;
    }

    .cal-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cal-month-label {
      font-size: 18px;
      font-weight: 600;
      color: #1C1C1E;
      min-width: 170px;
      text-align: center;
    }

    .cal-nav-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #D1D1D6;
      border-radius: 50%;
      background: #FFFFFF;
      color: #1C1C1E;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .cal-nav-btn:hover {
      background: #1C1C1E;
      border-color: #1C1C1E;
      color: #FFFFFF;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #E5E5E0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
    }

    .cal-dow {
      background: #F7F6F2;
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8E8E93;
      text-align: center;
    }

    .cal-day {
      background: #FFFFFF;
      min-height: 110px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cal-day.other-month {
      background: #FAFAF8;
    }

    .cal-day.today {
      background: #FFFBF5;
    }

    .cal-day-num {
      font-size: 13px;
      font-weight: 600;
      color: #3A3A3C;
      line-height: 1;
      margin-bottom: 4px;
    }

    .cal-day.other-month .cal-day-num { color: #C7C7CC; }
    .cal-day.today .cal-day-num { color: #D4860A; }

    .cal-post-item {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 7px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.15s;
    }
    .cal-post-item:hover { opacity: 0.7; }

    .cal-post-item[data-status="uploaded"]  { background: #E3F0FF; color: #0A58C2; }
    .cal-post-item[data-status="approved"]  { background: #E3F7E9; color: #1A6E3A; }
    .cal-post-item[data-status="scheduled"] { background: #FFF3DE; color: #8A4800; }
    .cal-post-item[data-status="published"] { background: #EDE9E1; color: #3A3A3C; }
    .cal-post-item[data-status="cancelled"] { background: #F2F2F7; color: #8E8E93; text-decoration: line-through; }
    .cal-post-item[data-status="rejected"]  { background: #FDE8E8; color: #C0392B; text-decoration: line-through; opacity: 0.6; }

    .cal-time {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.65;
      letter-spacing: 0.02em;
    }

    .cal-more {
      font-size: 11px;
      color: #8E8E93;
      padding: 2px 4px;
    }

    .loading {
      text-align: center;
      padding: 60px 0;
      font-size: 14px;
      color: #8E8E93;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #3A3A3C;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="cal-header">
      <div class="cal-header-left">
        <a href="/" class="back-link">← Posts</a>
        <h1>Content Calendar</h1>
      </div>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="prev-month">‹</button>
        <span class="cal-month-label" id="month-label"></span>
        <button class="cal-nav-btn" id="next-month">›</button>
      </div>
    </div>

    <div id="calendar-container">
      <div class="loading">Loading…</div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#E3F0FF;border:1px solid #0A58C2"></div>Uploaded</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E3F7E9;border:1px solid #1A6E3A"></div>Approved</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FFF3DE;border:1px solid #8A4800"></div>Scheduled</div>
      <div class="legend-item"><div class="legend-dot" style="background:#EDE9E1;border:1px solid #3A3A3C"></div>Published</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FDE8E8;border:1px solid #C0392B"></div>Rejected</div>
    </div>
  </div>

  <script>
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const IST_OFFSET_MS = (5 * 60 + 30) * 60 * 1000;

    function formatTimeIST(dateObj) {
      if (!dateObj) return null;
      const ist = new Date(dateObj.getTime() + IST_OFFSET_MS);
      const h = ist.getUTCHours();
      const m = ist.getUTCMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let allPosts = [];

    function postDate(post) {
      const raw = post.scheduled_time || post.created_at;
      if (!raw) return null;
      return new Date(raw.replace(' ', 'T'));
    }

    function renderCalendar() {
      document.getElementById('month-label').textContent = `${MONTHS[currentMonth]} ${currentYear}`;

      const today = new Date();
      const firstDay = new Date(currentYear, currentMonth, 1);
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const startDow = firstDay.getDay();

      const postsByDay = {};
      allPosts.forEach(post => {
        const d = postDate(post);
        if (!d) return;
        if (d.getFullYear() === currentYear && d.getMonth() === currentMonth) {
          const day = d.getDate();
          if (!postsByDay[day]) postsByDay[day] = [];
          postsByDay[day].push(post);
        }
      });

      let html = '<div class="cal-grid">';

      DAYS.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

      for (let i = 0; i < startDow; i++) {
        html += '<div class="cal-day other-month"></div>';
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = today.getFullYear() === currentYear &&
                        today.getMonth() === currentMonth &&
                        today.getDate() === day;
        const posts = postsByDay[day] || [];
        const maxShow = 3;

        html += `<div class="cal-day${isToday ? ' today' : ''}">`;
        html += `<div class="cal-day-num">${day}</div>`;

        posts.slice(0, maxShow).forEach(p => {
          const d = postDate(p);
          const timeStr = formatTimeIST(d);
          const topic = (p.topic || p.id).slice(0, 18);
          const label = timeStr ? `<span class="cal-time">${timeStr}</span> ${topic}` : topic;
          const href = p.status === 'draft' ? `/review/${p.id}` : `/preview/${p.id}`;
          html += `<div class="cal-post-item" data-status="${p.status}" onclick="location.href='${href}'" title="${p.topic || p.id}">${label}</div>`;
        });

        if (posts.length > maxShow) {
          html += `<div class="cal-more">+${posts.length - maxShow} more</div>`;
        }

        html += '</div>';
      }

      const filled = startDow + daysInMonth;
      const remainder = filled % 7;
      if (remainder > 0) {
        for (let i = remainder; i < 7; i++) {
          html += '<div class="cal-day other-month"></div>';
        }
      }

      html += '</div>';
      document.getElementById('calendar-container').innerHTML = html;
    }

    document.getElementById('prev-month').addEventListener('click', () => {
      if (--currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
      if (++currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    });

    fetch('/api/posts')
      .then(r => r.json())
      .then(posts => {
        allPosts = posts;
        renderCalendar();
      })
      .catch(() => {
        document.getElementById('calendar-container').innerHTML =
          '<div class="loading">Could not load posts. Is the server running?</div>';
      });
  </script>
</body>
</html>
