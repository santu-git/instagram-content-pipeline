<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts — Instagram Content Pipeline</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { overflow: auto; background: #F7F6F2; }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }

    .page-header {
      margin-bottom: 40px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1C1C1E;
      margin-bottom: 6px;
    }

    .page-header p {
      font-size: 14px;
      color: #8E8E93;
    }

    .header-nav-link {
      font-size: 13px;
      font-weight: 500;
      color: #D4860A;
      text-decoration: none;
      padding-top: 6px;
      white-space: nowrap;
    }
    .header-nav-link:hover { color: #B8730A; }

    /* Post cards */
    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-decoration: none;
      color: inherit;
      border: 1px solid #EBEBEB;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .post-card:hover {
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      border-color: #D4860A;
    }

    .card-template-bar {
      width: 4px;
      height: 48px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .card-template-bar[data-template="educator"]   { background: #1C1C1E; }
    .card-template-bar[data-template="challenger"] { background: #4A5240; }
    .card-template-bar[data-template="quicklist"]  { background: #D4860A; }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-topic {
      font-size: 16px;
      font-weight: 600;
      color: #1C1C1E;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #8E8E93;
      font-family: ui-monospace, 'SF Mono', 'Fira Code', monospace;
    }

    .card-meta .sep { color: #D1D1D6; }

    .card-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .card-scheduled {
      font-size: 12px;
      color: #8E8E93;
      font-family: ui-monospace, 'SF Mono', monospace;
      text-align: right;
    }

    .card-scheduled strong {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #C7C7CC;
      margin-bottom: 2px;
    }

    .arrow {
      color: #C7C7CC;
      font-size: 18px;
      line-height: 1;
    }

    /* Stats row on published cards */
    .card-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: #8E8E93;
      font-family: ui-monospace, 'SF Mono', 'Fira Code', monospace;
      margin-top: 6px;
    }

    .card-stats strong {
      color: #D4860A;
      font-weight: 600;
    }

    .refresh-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #C7C7CC;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .refresh-btn:hover { color: #D4860A; }
    .refresh-btn:disabled { opacity: 0.4; cursor: default; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px 0;
      color: #8E8E93;
    }

    .empty h2 {
      font-size: 18px;
      font-weight: 600;
      color: #3A3A3C;
      margin-bottom: 8px;
    }

    .empty p {
      font-size: 14px;
      line-height: 1.6;
    }

    .empty code {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      background: #EBEBEB;
      padding: 2px 6px;
      border-radius: 4px;
      color: #1C1C1E;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 60px 0;
      font-size: 14px;
      color: #8E8E93;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div>
        <h1>Posts</h1>
        <p>All carousel posts and their current status.</p>
      </div>
      <div style="display:flex;gap:16px;padding-top:6px">
        <a href="/analytics" class="header-nav-link">Analytics →</a>
        <a href="/calendar" class="header-nav-link">Calendar →</a>
      </div>
    </div>

    <div id="posts-list" class="posts-list">
      <div class="loading">Loading…</div>
    </div>
  </div>

  <script>
    function formatDate(str) {
      if (!str) return null;
      const d = new Date(str.replace(' ', 'T'));
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatScheduled(str) {
      if (!str) return null;
      const d = new Date(str.replace(' ', 'T'));
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) +
             ' · ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    }

    function statusBadgeHtml(status) {
      return `<span class="badge" data-status="${status}">${status}</span>`;
    }

    function fmt(n) { return n != null ? n.toLocaleString() : '—'; }

    function statsHtml(post) {
      if (post.status !== 'published') return '';
      if (!post.stats_fetched_at) {
        return `<div class="card-stats" id="stats-${post.id}"><span style="color:#C7C7CC">No stats yet — click ↻ to fetch</span></div>`;
      }
      return `<div class="card-stats" id="stats-${post.id}">
        <span>♥ <strong>${fmt(post.likes)}</strong></span>
        <span>💬 <strong>${fmt(post.comments)}</strong></span>
        <span>🔖 <strong>${fmt(post.saves)}</strong></span>
        <span>👁 <strong>${fmt(post.reach)}</strong> reach</span>
        ${post.impressions != null ? `<span>· <strong>${fmt(post.impressions)}</strong> impr.</span>` : ''}
      </div>`;
    }

    function refreshStats(postId, btn) {
      btn.disabled = true;
      btn.textContent = '…';
      fetch(`/api/stats/${postId}`)
        .then(r => r.json())
        .then(data => {
          const el = document.getElementById(`stats-${postId}`);
          if (el) {
            el.innerHTML = `
              <span>♥ <strong>${fmt(data.likes)}</strong></span>
              <span>💬 <strong>${fmt(data.comments)}</strong></span>
              <span>🔖 <strong>${fmt(data.saves)}</strong></span>
              <span>👁 <strong>${fmt(data.reach)}</strong> reach</span>
              ${data.impressions != null ? `<span>· <strong>${fmt(data.impressions)}</strong> impr.</span>` : ''}
              ${!data.insights_available ? '<span style="color:#C7C7CC">· insights pending</span>' : ''}
            `;
          }
          btn.textContent = '↻';
          btn.disabled = false;
        })
        .catch(() => {
          btn.textContent = '↻';
          btn.disabled = false;
        });
    }

    fetch('/api/posts')
      .then(r => r.json())
      .then(posts => {
        const container = document.getElementById('posts-list');

        if (!posts.length) {
          container.innerHTML = `
            <div class="empty">
              <h2>No posts yet</h2>
              <p>Run <code>node scripts/upload.js --id &lt;post-id&gt;</code> to add a post.</p>
            </div>`;
          return;
        }

        container.innerHTML = '';
        posts.forEach(post => {
          const wrapper = document.createElement('div');
          wrapper.style.position = 'relative';

          const a = document.createElement('a');
          a.href = post.status === 'draft' ? `/review/${post.id}` : `/preview/${post.id}`;
          a.className = 'post-card';

          const scheduled = post.scheduled_time ? formatScheduled(post.scheduled_time) : null;

          a.innerHTML = `
            <div class="card-template-bar" data-template="${post.template}"></div>
            <div class="card-body">
              <div class="card-topic">${post.topic || post.id}</div>
              <div class="card-meta">
                <span>${post.template}</span>
                <span class="sep">·</span>
                <span>${post.id}</span>
                <span class="sep">·</span>
                <span>${formatDate(post.created_at) || '—'}</span>
              </div>
              ${statsHtml(post)}
            </div>
            <div class="card-right">
              ${scheduled ? `<div class="card-scheduled"><strong>Scheduled</strong>${scheduled}</div>` : ''}
              ${statusBadgeHtml(post.status)}
              ${post.status === 'published' ? `<button class="refresh-btn" title="Refresh stats" onclick="event.preventDefault();event.stopPropagation();refreshStats('${post.id}',this)">↻</button>` : '<span class="arrow">›</span>'}
            </div>`;

          wrapper.appendChild(a);
          container.appendChild(wrapper);
        });
      })
      .catch(() => {
        document.getElementById('posts-list').innerHTML =
          '<div class="empty"><h2>Could not load posts</h2><p>Is the server running?</p></div>';
      });
  </script>
</body>
</html>
