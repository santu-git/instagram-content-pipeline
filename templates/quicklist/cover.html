<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>{{headline}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      background: #4A5240;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px;
    }
    .top {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .accent-line {
      width: 40px;
      height: 3px;
      background: #D4860A;
    }
    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #D4860A;
    }
    .middle {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .headline {
      font-family: 'Noto Serif JP', serif;
      font-size: 64px;
      font-weight: 400;
      line-height: 1.2;
      color: #FAFAFA;
    }
    .subtext {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 300;
      line-height: 1.6;
      color: #EDE9E1;
    }
    .handle {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 400;
      color: #D4860A;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="accent-line"></div>
    <div class="tag">{{tag}}</div>
  </div>
  <div class="middle">
    <div class="headline">{{headline}}</div>
    <div class="subtext">{{subtext}}</div>
  </div>
  <div class="handle">@{{handle}}</div>
</body>
</html>
