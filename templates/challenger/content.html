<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>{{headline}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      background: #EDE9E1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px;
    }
    .top {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .slide-number {
      font-family: 'DM Mono', monospace;
      font-size: 48px;
      font-weight: 400;
      color: #4A5240;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: #B8A898;
    }
    .middle {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .headline {
      font-family: 'Noto Serif JP', serif;
      font-size: 52px;
      font-weight: 400;
      line-height: 1.2;
      color: #1C1C1E;
    }
    .body {
      font-family: 'DM Sans', sans-serif;
      font-size: 26px;
      font-weight: 300;
      line-height: 1.65;
      color: #3A3A3C;
    }
    .handle {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 400;
      color: #8E8E93;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="slide-number">{{number}}</div>
    <div class="divider"></div>
  </div>
  <div class="middle">
    <div class="headline">{{headline}}</div>
    <div class="body">{{body}}</div>
  </div>
  <div class="handle">@{{handle}}</div>
</body>
</html>
