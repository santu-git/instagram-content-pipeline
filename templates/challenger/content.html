<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>{{headline}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }

    .slide {
      position: relative;
      width: 1080px;
      height: 1080px;
      background: #EDE9E1;
    }

    .top {
      position: absolute;
      top: 72px;
      left: 72px;
    }
    .slide-number {
      font-family: 'DM Mono', monospace;
      font-size: 56px;
      font-weight: 400;
      line-height: 1;
      color: #4A5240;
    }
    .rule {
      margin-top: 16px;
      width: 100%;
      height: 1px;
      background: #4A5240;
    }

    .middle {
      position: absolute;
      top: 160px;
      bottom: 120px;
      left: 72px;
      right: 72px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .content-wrapper {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .headline {
      font-family: 'Noto Serif JP', serif;
      font-size: 52px;
      font-weight: 400;
      line-height: 1.2;
      color: #1C1C1E;
      letter-spacing: -0.01em;
      max-width: 936px;
    }
    .body-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 26px;
      font-weight: 300;
      line-height: 1.65;
      color: #3A3A3C;
      max-width: 780px;
    }

    .bottom {
      position: absolute;
      bottom: 72px;
      left: 72px;
    }
    .handle {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      font-weight: 400;
      color: #8E8E93;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="top">
      <div class="slide-number">{{number}}</div>
      <div class="rule"></div>
    </div>
    <div class="middle">
      <div class="content-wrapper">
        <div class="headline">{{headline}}</div>
        <div class="body-text">{{body}}</div>
      </div>
    </div>
    <div class="bottom">
      <div class="handle">@{{handle}}</div>
    </div>
  </div>
</body>
</html>
